<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando...</title>
<meta http-equiv="refresh" content="3; url=https://t.me/luluzitaabot">
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f0f12;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
.card{max-width:420px;width:100%;background:#1a1a1f;border:1px solid #2a2a30;border-radius:20px;padding:28px}
.logo{font-size:44px}
h1{font-size:22px;margin:12px 0 8px}
p{color:#b8b8c0;font-size:15px;line-height:1.5}
.count{font-size:42px;font-weight:800;color:#2AABEE;margin:14px 0}
.btn{display:block;background:#2AABEE;color:#fff;text-decoration:none;padding:15px;border-radius:12px;font-weight:700;font-size:16px;margin-top:16px}
.btn2{display:block;background:transparent;color:#fff;border:1px solid #333;text-decoration:none;padding:12px;border-radius:12px;margin-top:10px;font-size:14px}
.badge{display:inline-block;background:#1e3a2a;color:#7ee2a8;border:1px solid #2e6b4a;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-top:14px}
small{color:#777;display:block;margin-top:14px;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="logo">🤖</div>
<h1>Te levando pro bot...</h1>
<p>Você será redirecionado para <b>@luluzitaabot</b> no Telegram em:</p>
<div class="count" id="c">3</div>
<a class="btn" href="https://t.me/luluzitaabot">Continuar Agora →</a>
<a class="btn2" href="#" onclick="cancelar();return false;">Cancelar redirecionamento</a>
<div class="badge">✓ Sem Pixel • Sem Rastreamento</div>
<small>Destino: t.me/luluzitaabot</small>
</div>
<script>
let n=3;
let timer=setInterval(()=>{
  n--;
  document.getElementById('c').textContent=n;
  if(n<=0){
    clearInterval(timer);
    window.location.href='https://t.me/luluzitaabot';
  }
},1000);
function cancelar(){
  clearInterval(timer);
  document.getElementById('c').textContent='—';
}
</script>
</body>
</html>
