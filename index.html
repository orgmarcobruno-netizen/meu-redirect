<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carregando...</title>
<meta http-equiv="refresh" content="15; url=https://t.me/luluzitaabot">
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#ffffff;color:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
.card{max-width:380px;width:100%}
.spinner{width:48px;height:48px;border:4px solid #e5e5e5;border-top:4px solid #111;border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:20px;font-weight:600;margin:0 0 8px}
p{color:#666;font-size:14px;line-height:1.5;margin:0}
.count{font-size:14px;color:#999;margin-top:16px}
.btn{display:block;background:#111;color:#fff;text-decoration:none;padding:14px;border-radius:10px;font-weight:600;font-size:15px;margin-top:22px}
</style>
</head>
<body>
<div class="card">
<div class="spinner"></div>
<h1>Carregando...</h1>
<p>Aguarde um momento, estamos te redirecionando.</p>
<div class="count">Aguarde <span id="c">15</span>s</div>
<a class="btn" href="https://t.me/luluzitaabot">Continuar</a>
</div>
<script>
let n=15;
let timer=setInterval(()=>{
  n--;
  document.getElementById('c').textContent=n;
  if(n<=0){
    clearInterval(timer);
    window.location.href='https://t.me/luluzitaabot';
  }
},1000);
</script>
</body>
</html>
